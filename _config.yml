locale: "en-US"
site_theme: "default"
title: "刘昭阳 Zhaoyang Liu"
title_separator: "-"
name: "刘昭阳 Zhaoyang Liu"
description: "刘昭阳 Zhaoyang Liu | PhD Student, ShanghaiTech University"
url: "https://zhy-liu.github.io"
baseurl: ""
repository: "zhy-liu/zhy-liu.github.io"

author:
  avatar: "profile.jpg"
  name: "刘昭阳 Zhaoyang Liu"
  bio: "PhD Student, ShanghaiTech University"
  email: "liuzhy2023@shanghaitech.edu.cn"
  googlescholar: "https://scholar.google.com/citations?user=Fdtto0wAAAAJ&hl=en"
  github: "zhy-liu"

breadcrumbs: false
read_more: "disabled"
comments:
  provider: false
atom_feed:
  hide: true

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules

encoding: "utf-8"
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
